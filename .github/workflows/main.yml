name: Build NEN ARENA APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Find project folder
        id: find
        run: |
          S=$(find . -name settings.gradle.kts | head -n1)
          if [ -z "$S" ]; then
            echo "KHONG TIM THAY settings.gradle.kts - cac file trong repo:"
            find . -not -path './.git/*' -type f | head -60
            exit 1
          fi
          D=$(dirname "$S")
          echo "Project o: $D"
          echo "dir=$D" >> "$GITHUB_OUTPUT"

      - name: Create debug keystore
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v -keystore ~/.android/debug.keystore \
              -storepass android -keypass android -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build APK (debug + release)
        working-directory: ${{ steps.find.outputs.dir }}
        run: gradle assembleDebug assembleRelease --stacktrace --no-daemon

      - name: Collect APKs
        working-directory: ${{ steps.find.outputs.dir }}
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/NenArena-debug.apk
          cp app/build/outputs/apk/release/app-release.apk dist/NenArena-release.apk
          ls -la dist

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: NenArena-APK
          path: ${{ steps.find.outputs.dir }}/dist/*.apk

      - name: Publish GitHub Release (khi push tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.find.outputs.dir }}/dist/*.apk
