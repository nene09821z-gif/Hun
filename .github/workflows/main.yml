name: Build NEN ARENA APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Prepare assets (three.js)
        run: |
          D=app/src/main/assets
          mkdir -p "$D"
          if [ ! -s "$D/index.html" ]; then
            echo "::error::Thiếu file $D/index.html"
            exit 1
          fi
          F="$D/three.min.js"
          if [ ! -s "$F" ] || [ "$(wc -c < "$F")" -lt 100000 ]; then
            curl -fsSL --retry 3 https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js -o "$F" \
              || curl -fsSL --retry 3 https://unpkg.com/three@0.149.0/build/three.min.js -o "$F"
          fi
          sed -i 's#https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js#three.min.js#' "$D/index.html"
          ls -la "$D"
          grep -n 'three.min.js' "$D/index.html"

      - name: Create debug keystore
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v -keystore ~/.android/debug.keystore \
              -storepass android -keypass android -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build APK
        run: gradle assembleDebug assembleRelease --stacktrace --no-daemon

      - name: Collect APKs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/NenArena-debug.apk
          cp app/build/outputs/apk/release/app-release.apk dist/NenArena-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: NenArena-APK
          path: dist/*.apk

      - name: Publish Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
